[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osintizada"
version = "0.2.0"
description = "OSINT Investigation Orchestrator — identificadores, pivôs, correlação e proveniência."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
osintizada = "osintizada.cli:main"

[tool.setuptools.packages.find]
include = ["osintizada*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
