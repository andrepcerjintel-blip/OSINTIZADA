[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osintizada"
version = "0.4.0"
description = "OSINT Investigation Orchestrator — identificadores, pivôs, correlação e proveniência."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "dnspython>=2.6",
    "publicsuffixlist>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "redis>=5.0",
    "rq>=2.0",
    "pillow>=10.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
telegram = ["telethon>=1.36"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "fakeredis[lua]>=2.23"]

[project.scripts]
osintizada = "osintizada.cli:main"

[tool.setuptools.packages.find]
include = ["osintizada*"]

[tool.setuptools.package-data]
"osintizada.db" = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
