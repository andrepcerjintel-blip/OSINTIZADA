# RINO — Plataforma de Investigação OSINT. Stack: api + worker + redis + postgres.
# Senhas NÃO ficam aqui: copie .env.example para .env (fora do Git) e defina
# POSTGRES_PASSWORD, REDIS_PASSWORD e RINO_API_TOKEN. Sem elas o compose recusa subir.
#
#   docker compose up -d --build
#   docker compose up -d --scale worker=3     # vários workers (claim atômico + lock por Case)

name: rino

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://osintizada:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/osintizada
  REDIS_CACHE_URL: ${REDIS_CACHE_URL:-}   # opcional: cache em Redis separado (LRU)
  REDIS_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}@redis:6379/0
  RINO_CONFIG: /app/config/rino.yaml
  RINO_AUTO_MIGRATE: "1"
  # Providers opcionais (vazios → NOT_CONFIGURED, nunca simulados)
  BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
  GOOGLE_CSE_API_KEY: ${GOOGLE_CSE_API_KEY:-}
  GOOGLE_CSE_CX: ${GOOGLE_CSE_CX:-}
  TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
  TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
  TELEGRAM_SESSION: ${TELEGRAM_SESSION:-}
  # IA auxiliar (opcional; docs/AI.md). Ollama roda FORA do compose (no host) — o RINO não baixa modelos.
  RINO_AI_MODE: ${RINO_AI_MODE:-LOCAL_ONLY}
  RINO_AI_LLAMA_ENABLED: ${RINO_AI_LLAMA_ENABLED:-false}
  RINO_AI_LLAMA_BASE_URL: ${RINO_AI_LLAMA_BASE_URL:-http://host.docker.internal:11434}
  RINO_AI_LLAMA_MODEL: ${RINO_AI_LLAMA_MODEL:-}
  RINO_AI_ALLOW_CLOUD_FALLBACK: ${RINO_AI_ALLOW_CLOUD_FALLBACK:-false}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  RINO_AI_OPENAI_MODEL: ${RINO_AI_OPENAI_MODEL:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Banco/usuário mantêm o nome legado: já existem nos volumes de instalações anteriores ao RINO.
      POSTGRES_DB: osintizada
      POSTGRES_USER: osintizada
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osintizada -d osintizada"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # AOF reduz perda da fila em reinício; mesmo sem ela o reconciliador republica pelo banco.
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    image: rino:latest
    environment:
      <<: *app-env
      RINO_API_TOKEN: ${RINO_API_TOKEN:?defina RINO_API_TOKEN no .env}
    command: ["rino", "serve", "--host", "0.0.0.0", "--port", "8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]   # alcançar o Ollama do host
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - appdata:/app/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  worker:
    build: .
    image: rino:latest
    environment: *app-env
    command: ["rino", "worker"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - appdata:/app/data     # exports/artefatos compartilhados com a API
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      # Saudável = há ao menos um worker com heartbeat recente no Redis.
      test: ["CMD", "rino", "worker-status", "--local", "--require-online"]
      interval: 15s
      timeout: 5s
      retries: 4
    # SIGTERM → o RQ termina o job atual (warm shutdown); se o tempo acabar, o reconciliador recupera.
    stop_grace_period: 60s
    restart: unless-stopped

# Nomes fixos (prefixo legado "osintizada_"): preservam os dados de instalações anteriores ao RINO,
# já que o nome do projeto compose mudou para "rino".
volumes:
  pgdata:
    name: osintizada_pgdata
  redisdata:
    name: osintizada_redisdata
  appdata:
    name: osintizada_appdata
